<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Câmeras</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="grid"></div>

  <div id="full" class="hidden">
    <div class="cell">
      <video autoplay muted playsinline></video>
      <div class="label"></div>
      <div class="status"></div>
    </div>
  </div>

  <div id="pageLabel" class="hidden"></div>
  <div id="hint">OK: tela cheia · ◀ ▶: página · Botão vermelho: configurações</div>

  <form id="settings" class="hidden" autocomplete="off">
    <h1>Configurações do DVR</h1>
    <label>Endereço IP <input name="host" type="text"></label>
    <label>Porta HTTP (página do DVR) <input name="httpPort" type="number"></label>
    <label>Porta RTSP <input name="rtspPort" type="number"></label>
    <label>Usuário <input name="user" type="text"></label>
    <label>Senha <input name="password" type="password"></label>
    <label>Número de câmeras <input name="channels" type="number"></label>
    <label>Layout
      <select name="columns">
        <option value="3">3×3 (até 9)</option>
        <option value="2">2×2 (4 por página)</option>
      </select>
    </label>
    <label>Grade
      <select name="liveGrid">
        <option value="0">Imagens (recomendado na TV)</option>
        <option value="1">Vídeo ao vivo (RTSP; usa imagens se falhar)</option>
      </select>
    </label>
    <button type="submit">Salvar</button>
    <p class="error"></p>
  </form>

  <script src="js/config.js"></script>
  <script src="js/config.local.js"></script>
  <script src="js/md5.js"></script>
  <script src="js/rtsp.js"></script>
  <script src="js/mp4.js"></script>
  <script src="js/player.js"></script>
  <script src="js/snapshot.js"></script>
  <script src="js/gridtile.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
